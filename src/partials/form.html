<section class="ask" id="start" aria-labelledby="ask-title">
  <div class="ask-copy">
    <h2 id="ask-title">See your website first. It's free.</h2>
    <ul class="ticks">
      <li>No card and no obligation</li>
      <li>Made for your business, on a private link</li>
      <li>Sent to you within 5 business days</li>
    </ul>
  </div>
  <form class="ask-form" id="ask" novalidate>
    <div class="two">
      <label>Business name <i class="req" aria-hidden="true">*</i><input name="business" id="ask-business" required autocomplete="organization" data-err="Enter your business name."></label>
      <label>Your name <i class="req" aria-hidden="true">*</i><input name="name" required autocomplete="name" data-err="Enter your name."></label>
    </div>
    <div class="two">
      <label>Your trade <i class="req" aria-hidden="true">*</i><input name="trade" id="ask-trade" required maxlength="40" placeholder="Plumber, clinic, salon" autocomplete="off" data-err="Enter your trade, such as plumber or clinic."></label>
      <label>Town <i class="req" aria-hidden="true">*</i><input name="town" id="ask-town" required autocomplete="address-level2" data-err="Enter your town."></label>
    </div>
    <div class="two">
      <label>Email <i class="req" aria-hidden="true">*</i><input name="email" id="ask-email" type="email" required placeholder="you@company.com" autocomplete="email" data-err="Enter an email like you@company.com."></label>
      <label>Phone <i class="req" aria-hidden="true">*</i><input name="phone" id="ask-phone" type="tel" required placeholder="(555) 010-0100" autocomplete="tel" data-err="Enter your phone number with area code."></label>
    </div>
    <label><span id="ask-website-label">Your website, if you have one</span><input name="website" id="ask-website" type="text" inputmode="url" placeholder="yourcompany.com" autocomplete="url" autocapitalize="off" spellcheck="false" data-err="Enter your website like yourcompany.com."></label>
    <input type="hidden" name="plan" id="ask-plan">
    <button class="btn btn-big" type="submit">Request my free preview</button>
    <p class="status" id="ask-status" role="status"></p>
    <p class="consent"><span class="req" aria-hidden="true">*</span> Required. By sending this, you agree to our <a href="terms.html" target="_blank" rel="noopener">terms</a> and <a href="privacy.html" target="_blank" rel="noopener">privacy policy</a>.</p>
  </form>
</section>
