<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sample site | MarveloWeb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Archivo:wght@700;800&family=Zilla+Slab:wght@600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sample.css?v=8">
<style>
  body { margin: 0; }
  .sample-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 16px; background: #0F0F12; color: #F4F1EA; font: 500 15px/1.3 "DM Sans", Arial, sans-serif; }
  .sample-bar a { padding: 10px 16px; border-radius: 999px; background: #FF3D7F; color: #0F0F12; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .sample-bar a:focus-visible, .sample-end a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .sample-end { padding: clamp(40px, 6vw, 72px) clamp(16px, 5vw, 88px); background: #0F0F12; color: #F4F1EA; font-family: "DM Sans", Arial, sans-serif; text-align: center; }
  .sample-end h2 { margin: 0; font: 800 clamp(34px, 5vw, 60px)/1.02 "Bricolage Grotesque", Arial, sans-serif; letter-spacing: -.04em; }
  .sample-end p { max-width: 52ch; margin: 14px auto 24px; color: #A3A3AE; font-size: 18px; line-height: 1.5; }
  .sample-end .go { display: inline-block; padding: 16px 32px; border: 2px solid #F4F1EA; border-radius: 999px; background: #FF3D7F; color: #0F0F12; font-size: 18px; font-weight: 700; text-decoration: none; transition: transform .18s; }
  .sample-end .go:hover { transform: translateY(-2px); }
  .sample-end ul { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 30px 0 0; padding: 0; list-style: none; }
  .sample-end li a { display: block; padding: 10px 16px; border: 1.5px solid rgba(244, 241, 234, .3); border-radius: 999px; color: #F4F1EA; font-size: 15px; text-decoration: none; }
  .sample-end li a:hover { border-color: #F4F1EA; }
</style>
</head>
<body>
<div class="sample-bar">
  <span>This is a sample for a made-up business. Yours uses your own details and photos.</span>
  <a id="bar-link" href="contact.html#start">Get one for my business</a>
</div>
<div id="site"></div>
<section class="sample-end" aria-labelledby="end-title">
  <h2 id="end-title">Want to customize this?</h2>
  <p>Change the name, colors, pages and photos. Tell us about your business and we'll build your version for free.</p>
  <a class="go" id="end-link" href="contact.html#start">Customize it for my business</a>
  <ul id="end-others" aria-label="Other sample sites"></ul>
</section>
<script src="sample.js?v=8"></script>
<script>
  const q = new URLSearchParams(location.search);
  const { TRADES, render } = MarveloSample;
  const trade = TRADES[q.get("trade")] ? q.get("trade") : "plumbing";
  render(document.getElementById("site"), { trade, name: q.get("name"), town: q.get("town"), full: true });
  const form = `contact.html?trade=${trade}#start`;
  document.getElementById("bar-link").href = form;
  document.getElementById("end-link").href = form;
  document.getElementById("end-others").innerHTML = Object.keys(TRADES).filter((k) => k !== trade)
    .map((k) => `<li><a href="sample.html?trade=${k}">${TRADES[k].label}</a></li>`).join("");
</script>
</body>
</html>
